name: ubuntu-vm
display_name: "Ubuntu VM"
description: "Blanke Ubuntu 22.04 VM mit Multi-User-Zugang. Optional: Node.js-Toolchain und Git-Repo-Klon."
version: "2.0.0"
category: "education"
author: "DHBW CloudStore Team"
icon: ubuntu.png

terraform:
  working_dir: terraform/
  required_version: ">= 1.6.0"

tags:
  - ubuntu
  - linux
  - education
  - multi-user

email_credentials:
  enabled: true

deploy-strategy:
  one-instance: true
  one-per-group: true

ui-groups:
  - id: general
    title: "Allgemein und Nutzer"
    order: 1
  - id: resources
    title: "Ressourcen"
    order: 2
  - id: specific
    title: "Optionale Software"
    order: 3

parameters:

  general:
    - name: app_name
      type: string
      required: true
      validation:
        pattern: "^[a-z0-9-]{3,20}$"
      description: "Projektname (wird Hostname und Name des Shared-Folders)"
      x-ui:
        group_id: general
        in_group_order: 1
        icon: Server
        placeholder: "z.B. linux-basics-ws25"
        hint: "Nur Kleinbuchstaben, Zahlen und Bindestriche (3-20 Zeichen)"

    - name: admin_username
      type: string
      required: true
      description: "Dozent (erhält Sudo-Rechte)"
      x-ui:
        group_id: general
        in_group_order: 2
        icon: Users
        placeholder: "Dozent auswählen..."
        widget:
          type: user-picker
          multi: false
          extract: email

    - name: students
      type: array
      required: false
      description: "Studierende (Linux-Accounts auf der VM, bei one-instance)"
      x-ui:
        group_id: general
        in_group_order: 3
        icon: Users
        placeholder: "Studierende auswählen..."
        hint: "Befüllen, wenn alle Studierenden sich eine geteilte VM teilen sollen. → Strategie 'one-instance' im nächsten Schritt."
        widget:
          type: user-picker
          multi: true
          extract: email

    - name: student_groups
      type: groups
      required: false
      description: "Projektgruppen der Studierenden (bei one-per-group: eine VM je Gruppe)"
      x-ui:
        group_id: general
        in_group_order: 4
        icon: Users
        hint: "Befüllen, wenn pro Gruppe eine eigene VM entstehen soll. → Strategie 'one-per-group' im nächsten Schritt."
        widget:
          type: group-builder
          extract: email

  specific:
    - name: flavor_name
      type: selection
      required: true
      default: "gp1.small"
      options:
        - label: "Small (1 CPU, 2 GB RAM) — Empfohlen"
          value: "gp1.small"
        - label: "Medium (2 CPU, 4 GB RAM)"
          value: "gp1.medium"
        - label: "Large (4 CPU, 8 GB RAM)"
          value: "gp1.large"
      description: "VM-Größe"
      x-ui:
        group_id: resources
        in_group_order: 1
        icon: Cpu
        hint: "Small reicht für Linux-Basics. Für mehr Nutzer oder zusätzliche Software größere Flavor wählen."

    - name: install_nodejs
      type: boolean
      default: false
      description: "Node.js installieren (inkl. NPM, PM2, Nodemon, TypeScript, NVM)"
      x-ui:
        group_id: specific
        in_group_order: 1
        hint: "Optional: Vorinstallierte Node.js-Toolchain für Web-Engineering."

    - name: node_version
      type: selection
      default: "20"
      options:
        - label: "Node.js 20 (LTS)"
          value: "20"
        - label: "Node.js 18 (LTS)"
          value: "18"
      required: false
      description: "Node.js Version (nur relevant wenn 'Node.js installieren' aktiv ist)"
      x-ui:
        group_id: specific
        in_group_order: 2

    - name: git_repo_url
      type: string
      required: false
      validation:
        pattern: "^https?://.*\\.git$|^$"
      description: "Git Repository URL (wird optional in den Shared-Folder geklont)"
      x-ui:
        group_id: specific
        in_group_order: 3
        placeholder: "https://github.com/org/repo.git"
        hint: "Optional: Übungsmaterial, Setup-Skripte oder Dotfiles."

outputs:
  - name: instance_id
    description: "System ID der Instanz"
    display: false

  - name: app_name
    description: "Projektname"
    display: true

  - name: ssh_command
    description: "SSH Befehl für Zugriff"
    display: true

  - name: shared_folder_path
    description: "Pfad zum Shared Workspace"
    display: true

  - name: admin_credentials
    description: "Admin-Zugangsdaten (Dozent)"
    sensitive: true
    display: false

  - name: student_credentials
    description: "Studierenden-Zugangsdaten"
    sensitive: true
    display: false

  - name: ssh_private_key
    description: "SSH Private Key"
    sensitive: true
    display: false
