#cloud-config
ssh_pwauth: true
package_update: true
package_upgrade: true

packages:
  - curl
  - git
  - build-essential
  - htop
  - net-tools
  - ufw
  - acl

runcmd:
  # SSH Passwort-Login erzwingen
  - sed -i 's/PasswordAuthentication no/PasswordAuthentication yes/g' /etc/ssh/sshd_config
  - sed -i 's/PasswordAuthentication no/PasswordAuthentication yes/g' /etc/ssh/sshd_config.d/*.conf || true
  - systemctl restart ssh

  # Shared Workspace + Shared Group
  - groupadd workspace
  - mkdir -p /opt/${app_name}
  - chown root:workspace /opt/${app_name}
  - chmod 2775 /opt/${app_name}

  # Admin (Dozent, sudo)
  - useradd -m -s /bin/bash -G sudo,workspace ${admin_username}
  - echo '${admin_username}:${admin_password}' | chpasswd
  - ln -s /opt/${app_name} /home/${admin_username}/project
  - chown -h ${admin_username}:${admin_username} /home/${admin_username}/project

  # Studierende
%{ for student in students ~}
  - useradd -m -s /bin/bash -G workspace ${student.username}
  - echo '${student.username}:${student.password}' | chpasswd
  - ln -s /opt/${app_name} /home/${student.username}/project
  - chown -h ${student.username}:${student.username} /home/${student.username}/project
%{ endfor ~}

  # Optional: Node.js Toolchain
%{ if install_nodejs ~}
  - curl -fsSL https://deb.nodesource.com/setup_${node_version}.x | sudo -E bash -
  - apt-get install -y nodejs
  - npm install -g pm2 nodemon typescript yarn
  - mkdir -p /usr/local/nvm
  - curl -o- https://raw.githubusercontent.com/nvm-sh/nvm/v0.39.7/install.sh | NVM_DIR=/usr/local/nvm bash
  - chown -R root:workspace /usr/local/nvm
  - chmod -R 775 /usr/local/nvm
  - |
    cat > /etc/profile.d/nvm_env.sh <<'EOF'
    export NVM_DIR="/usr/local/nvm"
    [ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh"
    EOF
  - chmod 0644 /etc/profile.d/nvm_env.sh
%{ endif ~}

  # Optional: Git-Repo in Shared Folder klonen
  - |
    if [ -n "${git_repo_url}" ]; then
      rm -rf /opt/${app_name}/*
      git clone "${git_repo_url}" /opt/${app_name}
      chown -R root:workspace /opt/${app_name}
      chmod -R 2775 /opt/${app_name}
    fi

  # Firewall
  - ufw allow 22,3000,8080/tcp
  - echo "y" | ufw enable
